name: CI

on:
  pull_request:
    branches: [ main ]

  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore VolleyHub.slnx

      - name: Build
        run: dotnet build VolleyHub.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test VolleyHub.slnx --configuration Release --no-build